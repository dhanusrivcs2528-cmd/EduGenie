<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EduGenie - AI Learning Assistant</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='style.css') }}"
    >
</head>

<body>

<div class="page">

    <header class="hero">

        <div class="badge">
            AI LEARNING ASSISTANT
        </div>

        <h1>EduGenie</h1>

        <p>
            Learn smarter with AI-powered explanations,
            answers, quizzes, summaries, and personalized
            learning paths.
        </p>

    </header>


    <main class="card">

        <section class="form-section">

            <label for="task">
                Choose a learning task
            </label>

            <select id="task">

                <option value="qa">
                    Ask a Question
                </option>

                <option value="explain">
                    Explain a Concept
                </option>

                <option value="quiz">
                    Generate Quiz
                </option>

                <option value="summarize">
                    Summarize Text
                </option>

                <option value="learn">
                    Learning Path
                </option>

            </select>


            <label for="level" id="levelLabel">
                Learning level
            </label>

            <select id="level">

                <option value="beginner">
                    Beginner
                </option>

                <option value="intermediate">
                    Intermediate
                </option>

                <option value="advanced">
                    Advanced
                </option>

            </select>


            <label for="inputText" id="inputLabel">
                Your question
            </label>

            <textarea
                id="inputText"
                rows="10"
                placeholder="Example: What is photosynthesis?"
            ></textarea>


            <button id="submitButton">
                <span id="buttonText">
                    Ask EduGenie
                </span>

                <span
                    id="spinner"
                    class="spinner hidden"
                ></span>
            </button>

        </section>


        <section
            id="errorBox"
            class="error hidden"
        ></section>


        <section
            id="resultSection"
            class="result hidden"
        >

            <div class="result-header">

                <h2 id="resultTitle">
                    Result
                </h2>

                <button
                    id="copyButton"
                    class="secondary-button"
                >
                    Copy
                </button>

            </div>

            <div id="resultContent"></div>

        </section>

    </main>


    <footer>
        EduGenie • FastAPI + Google Gemini
    </footer>

</div>


<script
    src="{{ url_for('static', path='app.js') }}"
></script>

</body>
</html>
